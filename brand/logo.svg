<?xml version="1.0" encoding="UTF-8"?>
<!-- Samaroh brand mark: an abstract celebration hall — three arches under a canopy,
     the tall centre arch echoing a mandap entrance. Original artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Samaroh">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7965AF"/>
      <stop offset="1" stop-color="#6750A4"/>
    </linearGradient>
  </defs>

  <!-- Material-style squircle background -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>

  <!-- Canopy line -->
  <path d="M96 168 Q256 96 416 168" fill="none" stroke="#EADDFF" stroke-width="28" stroke-linecap="round"/>

  <!-- Centre arch (tall) -->
  <path d="M196 400 V268 Q196 196 256 196 Q316 196 316 268 V400 Z" fill="#FFFFFF"/>

  <!-- Side arches -->
  <path d="M100 400 V308 Q100 260 140 260 Q180 260 180 308 V400 Z" fill="#EADDFF"/>
  <path d="M332 400 V308 Q332 260 372 260 Q412 260 412 308 V400 Z" fill="#EADDFF"/>

  <!-- Plinth -->
  <rect x="84" y="400" width="344" height="24" rx="12" fill="#EADDFF"/>

  <!-- Celebration spark above the canopy -->
  <circle cx="256" cy="132" r="18" fill="#FFD8E4"/>
</svg>
