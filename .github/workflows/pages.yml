name: Help site (GitHub Pages)

# Builds the public help site from help/guide.json and deploys it to GitHub Pages on every
# push to main that touches the guide, its scripts or this workflow. Pages must be set to
# "GitHub Actions" as the source (Settings → Pages → Build and deployment → Source).
# Public URL: https://itsluminous.github.io/samaroh-shared/help/<lang>/<screenId>.html
on:
  push:
    branches: [main]
    paths:
      - 'help/**'
      - 'scripts/build-help-site.mjs'
      - 'scripts/export-help-markdown.mjs'
      - 'scripts/validate-help.mjs'
      - 'strings/**'
      - 'permissions/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build help site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate guide
        run: node scripts/validate-help.mjs
      - name: Build static site
        run: node scripts/build-help-site.mjs --out "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
